name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y iverilog yosys

      - name: Build and test
        run: ./scripts/test.sh

      - name: Upload reference render
        uses: actions/upload-artifact@v4
        with:
          name: reference-render
          path: software/dda_reference/rendered_output.pgm
